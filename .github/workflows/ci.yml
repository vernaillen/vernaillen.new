name: ci

# Two chained jobs on every branch:
#
#   check  ──▶  build-deploy
#   (lint,      (pnpm generate; on main only, rsync to Combell + purge Bunny)
#    typecheck)
#
# `needs: check` means a lint or type error never reaches the build, let alone
# the docroot. The split is on the CHECKS, not on the build, on purpose: a
# second job gets a fresh runner, so moving the build there too would either
# repeat the prerender (nitro.prerender means `nuxt build` already encodes every
# AVIF variant — that duplication is why this replaced the old ci +
# deploy-combell pair) or need an artifact round-trip, and upload-artifact
# excludes dotfiles by default, which would silently drop public/.htaccess —
# the file that supplies every production cache header. Building and deploying
# in one job costs one cached `pnpm install` instead.
#
# build-deploy runs on every branch so a broken build is caught on feature
# branches too; only its last two steps are gated on main.

on:
  push:
  workflow_dispatch:

# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   Secrets:
#     COMBELL_SSH_KEY   - PRIVATE deploy key (full contents incl. the BEGIN/END
#                         lines). Its public half is authorized on the Combell
#                         account. Use a DEDICATED key, not a personal one.
#     NUXT_GITHUB_TOKEN - read-only GitHub token; bakes the Open Source page data
#                         into the static build.
#     BUNNY_API_KEY     - Bunny.net account API key for the post-deploy edge purge.
#   Variables:
#     COMBELL_DOCROOT   - remote web root as an rsync target, WITH trailing slash.
#                         Find it by running `pwd` in the web root over SSH (e.g. ~/www/).
#     RADIO_ORIGIN_URL  - absolute URL of the radio app's stream proxy
#                         (https://radio.vernaillen.dev/api/radio)
#     BUNNY_PULLZONE_ID - Bunny pull-zone numeric id. Unset = the purge step
#                         no-ops, so a deploy still succeeds without Bunny.

env:
  # Combell SSH endpoint for this pack (from the working `ssh vernaillen` config).
  # Not secret — the private key is the protected part; safe to keep in the file.
  SSH_HOST: ssh076.webhosting.be
  SSH_USER: vernaillencom
  SSH_PORT: '22'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      # postinstall runs `nuxt prepare`, so the generated types exist by the
      # time typecheck runs.
      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  build-deploy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Also the deploy artifact — a green run here is exactly what gets rsynced.
      - name: Build static site
        run: pnpm generate
        env:
          NUXT_GITHUB_TOKEN: ${{ secrets.NUXT_GITHUB_TOKEN }}
          # Absolute so the static page's <audio> reaches the radio app's proxy
          # crossorigin; falls back to same-origin /api/radio if the var is unset.
          NUXT_PUBLIC_RADIO_URL: ${{ vars.RADIO_ORIGIN_URL }}

      # From here on: main only.
      #
      # rsync delta sync over SSH. Only changed files transfer, which matters
      # given the many prerendered AVIF variants. --delete mirrors the docroot to
      # the build so stale files are removed; dotfiles (.htaccess) are included.
      - name: Deploy to Combell over rsync/SSH
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.COMBELL_SSH_KEY }}" > ~/.ssh/combell_deploy
          chmod 600 ~/.ssh/combell_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            -e "ssh -i ~/.ssh/combell_deploy -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            ./.output/public/ \
            "$SSH_USER@$SSH_HOST:${{ vars.COMBELL_DOCROOT }}"

      # Flush the Bunny edge cache so visitors get the fresh build immediately.
      # No-ops until BUNNY_PULLZONE_ID is set, so deploys work before Bunny is live.
      - name: Purge Bunny edge cache
        if: github.ref == 'refs/heads/main' && vars.BUNNY_PULLZONE_ID != ''
        run: |
          curl -fsS -X POST \
            "https://api.bunny.net/pullzone/${{ vars.BUNNY_PULLZONE_ID }}/purgeCache" \
            -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"
