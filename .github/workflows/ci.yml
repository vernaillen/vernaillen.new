name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check
        run: pnpm run check

  # Build the production image, smoke-test it boots and serves, then push to the
  # self-hosted registry. Runs on native amd64 (no QEMU) after `ci` passes, and
  # only on main. This replaces the Jenkins dockerSmokeTest + the on-master builds.
  build-push:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: registry.apps.vernaillen.dev/vernaillen-dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.apps.vernaillen.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # load: true keeps the image local so we can smoke-test before pushing.
      # Native amd64 runner => better-sqlite3 uses its prebuilt binary, no compile.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          secrets: |
            nuxt_github_token=${{ secrets.NUXT_GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boot the image and hit it on :3000)
        run: |
          docker run -d --name smoke -p 3000:3000 "${IMAGE}:${{ github.sha }}"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then ok=1; break; fi
            sleep 1
          done
          echo "----- container logs -----"; docker logs smoke || true
          docker rm -f smoke >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "::error::Smoke test failed — image did not serve on :3000"; exit 1; }

      - name: Push image
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

      # Coolify pulls :latest but won't redeploy on its own — hit its deploy API
      # so the new image goes live. COOLIFY_DEPLOY_URL is the full deploy endpoint
      # incl. ?uuid=<resource-uuid>; must be reachable from GitHub-hosted runners.
      - name: Trigger Coolify redeploy
        id: coolify
        run: |
          resp=$(curl --fail-with-body -sS -X POST "${{ secrets.COOLIFY_DEPLOY_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}")
          echo "$resp"
          echo "deployment_uuid=$(echo "$resp" | jq -r '.deployments[0].deployment_uuid // empty')" >> "$GITHUB_OUTPUT"

      # Pages are edge-cached at Cloudflare (s-maxage route rules), so the zone
      # must be purged once the NEW container is live — purging before the swap
      # would just refill the edge from the old build. Waits for the Coolify
      # deployment to finish (fixed fallback wait if its uuid can't be read),
      # then purges everything (assets are content-hashed, so this is safe).
      # Skips gracefully while the CLOUDFLARE_* secrets aren't configured.
      - name: Purge Cloudflare cache after deploy
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          DEPLOYMENT_UUID: ${{ steps.coolify.outputs.deployment_uuid }}
        run: |
          if [ -z "$CF_PURGE_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "CLOUDFLARE_ZONE_ID / CLOUDFLARE_PURGE_TOKEN not set; skipping edge purge"
            exit 0
          fi
          api_base="${COOLIFY_DEPLOY_URL%%/deploy*}"
          if [ -n "$DEPLOYMENT_UUID" ]; then
            echo "Waiting for Coolify deployment $DEPLOYMENT_UUID to finish..."
            for i in $(seq 1 60); do
              status=$(curl -fsS "$api_base/deployments/$DEPLOYMENT_UUID" \
                -H "Authorization: Bearer $COOLIFY_TOKEN" | jq -r '.status // empty' || true)
              echo "  status: ${status:-unknown}"
              case "$status" in
                finished) break ;;
                failed|cancelled) echo "::error::Coolify deployment $status"; exit 1 ;;
              esac
              sleep 10
            done
          else
            echo "No deployment uuid returned; falling back to a fixed wait"
            sleep 150
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "Edge cache purged"
