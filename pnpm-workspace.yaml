allowBuilds:
  better-sqlite3: true
  sharp: true
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

minimumReleaseAgeExclude:
  - '@fft-visualizer/core@1.0.0'
  - '@fft-visualizer/vue@1.0.0'
